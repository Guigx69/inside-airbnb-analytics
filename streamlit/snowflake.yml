definition_version: 2
entities:
  streamlit_app:
    type: streamlit
    main_file: streamlit_app.py
    artifacts:
      - pyproject.toml
      - streamlit_app.py
      - .streamlit/config.toml
      - pages/*
      - ui/*
    identifier:
      database: AIRBNB
      schema: DBT_GGILLET_MARTS
      name: INSIDE_AIRBNB_ANALYTICS_DEV
    title: Inside Airbnb Analytics DEV
    query_warehouse: DBT_WH
    compute_pool: SYSTEM_COMPUTE_POOL_CPU
    run_mode: SpcsOnly
    execute_as: OWNER
    sharing:
      - role: DBT_ROLE
        with_grant_option: true

name: Audit du catalogue World

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5
      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Installer les dépendances du collecteur
        run: python -m pip install "requests>=2.31,<3"
      - name: Comparer le catalogue au manifeste
        id: audit
        run: |
          code=0
          python scripts/audit_catalogue_world.py --rapport audit-world.json || code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0)
              echo "::notice::Catalogue couvert par le manifeste."
              ;;
            2)
              echo "::warning::Nouvelles archives détectées. Consulter le rapport d'audit."
              ;;
            *)
              echo "::error::Échec technique de l'audit (code $code). Consulter les logs."
              exit "$code"
              ;;
          esac
      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rapport-audit-world
          path: audit-world.json
          if-no-files-found: warn
          retention-days: 30

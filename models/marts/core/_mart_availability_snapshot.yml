version: 2

models:
  - name: mart_availability_snapshot
    description: >
      Indicateurs de disponibilité du marché issus des calendriers Inside Airbnb. Chaque ligne représente un pays, une ville et un snapshot. La disponibilité reflète l'état public du calendrier et ne prouve ni une occupation effective ni une réservation confirmée.

    columns:
      - name: source_country
        description: Pays associé au jeu de données source.
        data_tests:
          - not_null

      - name: source_city
        description: Ville associée au jeu de données source.
        data_tests:
          - not_null

      - name: snapshot_date
        description: Date du snapshot Inside Airbnb.
        data_tests:
          - not_null

      - name: listing_count
        description: Nombre d'annonces observées dans le périmètre considéré.
        data_tests:
          - not_null

      - name: calendar_row_count
        description: Nombre total de lignes de calendrier représentées.
        data_tests:
          - not_null

      - name: calendar_day_count
        description: Nombre total de journées-annonces représentées dans le calendrier.
        data_tests:
          - not_null

      - name: available_day_count
        description: Nombre de journées-annonces indiquées comme disponibles.
        data_tests:
          - not_null

      - name: unavailable_day_count
        description: Nombre de journées-annonces indiquées comme indisponibles ; ne prouve pas une réservation.
        data_tests:
          - not_null

      - name: market_availability_rate_pct
        description: Pourcentage de journées-annonces représentées indiquées disponibles sur le marché.
        data_tests:
          - not_null

      - name: market_unavailability_rate_pct
        description: Pourcentage de journées-annonces représentées indiquées indisponibles sur le marché.
        data_tests:
          - not_null

      - name: average_listing_availability_rate_pct
        description: Moyenne des taux de disponibilité individuels des annonces.
        data_tests:
          - not_null

      - name: p10_listing_availability_rate_pct
        description: 10e percentile des taux de disponibilité individuels des annonces.
        data_tests:
          - not_null

      - name: p25_listing_availability_rate_pct
        description: 25e percentile des taux de disponibilité individuels des annonces.
        data_tests:
          - not_null

      - name: median_listing_availability_rate_pct
        description: Médiane des taux de disponibilité individuels des annonces.
        data_tests:
          - not_null

      - name: p75_listing_availability_rate_pct
        description: 75e percentile des taux de disponibilité individuels des annonces.
        data_tests:
          - not_null

      - name: p90_listing_availability_rate_pct
        description: 90e percentile des taux de disponibilité individuels des annonces.
        data_tests:
          - not_null

      - name: fully_unavailable_listing_count
        description: Nombre d'annonces sans aucune journée disponible.
        data_tests:
          - not_null

      - name: low_availability_listing_count
        description: Nombre d'annonces dont le taux de disponibilité est supérieur à 0 % et inférieur ou égal à 25 %.
        data_tests:
          - not_null

      - name: medium_low_availability_listing_count
        description: Nombre d'annonces dont le taux de disponibilité est supérieur à 25 % et inférieur ou égal à 50 %.
        data_tests:
          - not_null

      - name: medium_high_availability_listing_count
        description: Nombre d'annonces dont le taux de disponibilité est supérieur à 50 % et inférieur ou égal à 75 %.
        data_tests:
          - not_null

      - name: high_availability_listing_count
        description: Nombre d'annonces dont le taux de disponibilité est supérieur à 75 % et inférieur à 100 %.
        data_tests:
          - not_null

      - name: fully_available_listing_count
        description: Nombre d'annonces dont toutes les journées représentées sont disponibles.
        data_tests:
          - not_null

      - name: fully_unavailable_listing_share_pct
        description: Part des annonces sans aucune journée disponible.
        data_tests:
          - not_null

      - name: low_availability_listing_share_pct
        description: Part des annonces dont le taux de disponibilité est supérieur à 0 % et inférieur ou égal à 25 %.
        data_tests:
          - not_null

      - name: medium_low_availability_listing_share_pct
        description: Part des annonces dont le taux de disponibilité est supérieur à 25 % et inférieur ou égal à 50 %.
        data_tests:
          - not_null

      - name: medium_high_availability_listing_share_pct
        description: Part des annonces dont le taux de disponibilité est supérieur à 50 % et inférieur ou égal à 75 %.
        data_tests:
          - not_null

      - name: high_availability_listing_share_pct
        description: Part des annonces dont le taux de disponibilité est supérieur à 75 % et inférieur à 100 %.
        data_tests:
          - not_null

      - name: fully_available_listing_share_pct
        description: Part des annonces présentant 100 % de disponibilité.
        data_tests:
          - not_null
version: 2

models:
  - name: mart_neighbourhood_snapshot
    description: >
      Indicateurs par quartier issus des annonces observées. Chaque ligne représente un pays, une ville, un snapshot et un quartier. Pour Lyon V1, les quartiers correspondent aux neuf arrondissements. Les prix sont nuls lorsqu'ils sont absents de la source. La disponibilité publique ne représente ni une vacance constatée ni le complément d'un taux d'occupation.

    columns:
      - name: source_country
        description: Pays associé au jeu de données source.
        data_tests:
          - not_null

      - name: source_city
        description: Ville associée au jeu de données source.
        data_tests:
          - not_null

      - name: snapshot_date
        description: Date du snapshot Inside Airbnb.
        data_tests:
          - not_null

      - name: neighbourhood
        description: Quartier associé à l'annonce ; pour Lyon V1, il s'agit de l'un des neuf arrondissements.
        data_tests:
          - not_null

      - name: listing_count
        description: Nombre d'annonces observées dans le périmètre considéré.
        data_tests:
          - not_null

      - name: entire_home_listing_count
        description: Nombre d'annonces de type logement entier.
        data_tests:
          - not_null

      - name: private_room_listing_count
        description: Nombre d'annonces de type chambre privée.
        data_tests:
          - not_null

      - name: shared_room_listing_count
        description: Nombre d'annonces de type chambre partagée.
        data_tests:
          - not_null

      - name: host_count
        description: Nombre d'hôtes distincts observés.
        data_tests:
          - not_null

      - name: superhost_listing_count
        description: Nombre d'annonces dont l'hôte est identifié comme Superhost.
        data_tests:
          - not_null

      - name: listings_with_price
        description: Nombre d'annonces dont le prix est renseigné.
        data_tests:
          - not_null

      - name: average_price
        description: Prix moyen des annonces disposant d'un prix exploitable ; nul si aucun prix n'est disponible.

      - name: median_price
        description: Prix médian des annonces disposant d'un prix exploitable ; nul si aucun prix n'est disponible.

      - name: average_availability_rate_pct
        description: Taux moyen de disponibilité du calendrier public des annonces ; ne constitue pas un taux d'occupation.

      - name: average_availability_30
        description: Disponibilité native moyenne sur 30 jours, telle que fournie par Inside Airbnb.
        data_tests:
          - not_null

      - name: average_availability_365
        description: Disponibilité native moyenne sur 365 jours, telle que fournie par Inside Airbnb.
        data_tests:
          - not_null

      - name: native_review_count_total
        description: Somme des compteurs d'avis natifs fournis par Inside Airbnb.
        data_tests:
          - not_null

      - name: reconstructed_review_count_total
        description: Nombre total d'avis reconstitués à partir des avis dédupliqués à la date du snapshot.
        data_tests:
          - not_null

      - name: reconstructed_review_count_l30d
        description: Nombre d'avis reconstitués sur les 30 jours précédant la date du snapshot, inclusivement.
        data_tests:
          - not_null

      - name: reconstructed_review_count_l90d
        description: Nombre d'avis reconstitués sur les 90 jours précédant la date du snapshot, inclusivement.
        data_tests:
          - not_null

      - name: reconstructed_review_count_l365d
        description: Nombre d'avis reconstitués sur les 365 jours précédant la date du snapshot, inclusivement.
        data_tests:
          - not_null

      - name: average_listing_latitude
        description: Latitude moyenne des annonces observées ; ne représente pas le centroïde géographique officiel du quartier.
        data_tests:
          - not_null

      - name: average_listing_longitude
        description: Longitude moyenne des annonces observées ; ne représente pas le centroïde géographique officiel du quartier.
        data_tests:
          - not_null
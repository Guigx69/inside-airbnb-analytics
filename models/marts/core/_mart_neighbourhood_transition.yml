version: 2

models:
  - name: mart_neighbourhood_transition
    description: >
      Mouvements du marché par quartier entre snapshots Inside Airbnb consécutifs. Chaque ligne représente un pays, une ville, un quartier et une paire de snapshots. Un déplacement géographique n'est constaté que lorsque l'annonce est observée dans les deux snapshots et change de quartier. Une réapparition après interruption reste classée returned_after_gap : le moment d'un éventuel déplacement pendant la période non observée est inconnu.

    columns:
      - name: source_country
        data_tests:
          - not_null

      - name: source_city
        data_tests:
          - not_null

      - name: neighbourhood
        data_tests:
          - not_null

      - name: previous_snapshot_date
        data_tests:
          - not_null

      - name: snapshot_date
        data_tests:
          - not_null

      - name: days_between_snapshots
        data_tests:
          - not_null

      - name: previous_listing_count
        data_tests:
          - not_null

      - name: current_listing_count
        data_tests:
          - not_null

      - name: net_listing_change
        data_tests:
          - not_null

      - name: net_listing_change_pct
        data_tests:
          - not_null

      - name: retained_listing_count
        description: >
          Annonces observées dans les deux snapshots consécutifs et conservées dans le même quartier.
        data_tests:
          - not_null

      - name: disappeared_listing_count
        description: >
          Listings present in the previous snapshot but absent from the current
          snapshot. This does not prove permanent exit from Airbnb.
        data_tests:
          - not_null

      - name: moved_out_listing_count
        description: >
          Annonces observées dans les deux snapshots consécutifs ayant quitté ce quartier.
        data_tests:
          - not_null

      - name: moved_in_listing_count
        description: >
          Annonces observées dans les deux snapshots consécutifs ayant rejoint ce quartier.
        data_tests:
          - not_null

      - name: newly_observed_listing_count
        description: >
          Annonces observées pour la première fois dans ce quartier sur la période historique disponible.
        data_tests:
          - not_null

      - name: returned_after_gap_listing_count
        description: >
          Listings observed historically, absent from the immediately preceding
          snapshot and observed again in the current snapshot.
        data_tests:
          - not_null

      - name: retention_rate_pct
        data_tests:
          - not_null

      - name: disappearance_rate_pct
        data_tests:
          - not_null

      - name: moved_out_rate_pct
        data_tests:
          - not_null

      - name: newly_observed_share_pct
        data_tests:
          - not_null

      - name: returned_after_gap_share_pct
        data_tests:
          - not_null

      - name: moved_in_share_pct
        data_tests:
          - not_null

      - name: has_returned_listings
        data_tests:
          - not_null

      - name: has_geographic_movement
        data_tests:
          - not_null
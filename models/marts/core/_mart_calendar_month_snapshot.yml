version: 2

models:
  - name: mart_calendar_month_snapshot
    description: >
      Indicateurs mensuels de disponibilité du marché calculés à partir du calendrier détaillé Inside Airbnb. Chaque ligne correspond à un pays, une ville, un snapshot et un mois calendaire. Les mois incomplets sont conservés avec des indicateurs explicites de couverture. La disponibilité correspond aux dates indiquées disponibles dans le calendrier source ; elle ne prouve ni une occupation ni une réservation confirmée.

    columns:
      - name: source_country
        description: Pays associé au jeu de données source.
        data_tests:
          - not_null

      - name: source_city
        description: Ville associée au jeu de données source.
        data_tests:
          - not_null

      - name: snapshot_date
        description: Date du snapshot Inside Airbnb dont le calendrier est extrait.
        data_tests:
          - not_null

      - name: calendar_month
        description: Premier jour du mois calendaire représenté par la ligne.
        data_tests:
          - not_null

      - name: days_in_calendar_month
        description: Nombre total de jours calendaires du mois correspondant.
        data_tests:
          - not_null

      - name: listing_count
        description: Nombre d'annonces représentées au moins une fois durant le mois.
        data_tests:
          - not_null

      - name: first_observed_date
        description: Date calendaire représentée la plus ancienne du mois, toutes annonces confondues.
        data_tests:
          - not_null

      - name: last_observed_date
        description: Date calendaire représentée la plus récente du mois, toutes annonces confondues.
        data_tests:
          - not_null

      - name: min_days_per_listing
        description: Nombre minimal de jours représentés pour une annonce durant le mois.
        data_tests:
          - not_null

      - name: max_days_per_listing
        description: Nombre maximal de jours représentés pour une annonce durant le mois.
        data_tests:
          - not_null

      - name: full_month_listing_count
        description: Nombre d'annonces représentées chaque jour calendaire du mois.
        data_tests:
          - not_null

      - name: partial_month_listing_count
        description: Nombre d'annonces représentées sur une partie seulement du mois.
        data_tests:
          - not_null

      - name: represented_listing_days
        description: Nombre total de journées-annonces effectivement représentées dans le calendrier source.
        data_tests:
          - not_null

      - name: expected_listing_days_for_present_listings
        description: >
          Nombre théorique de journées-annonces si chaque annonce présente durant le mois était représentée chaque jour calendaire.
        data_tests:
          - not_null

      - name: available_day_count
        description: Nombre total de journées-annonces représentées et indiquées disponibles.
        data_tests:
          - not_null

      - name: unavailable_day_count
        description: Nombre total de journées-annonces représentées et indiquées indisponibles.
        data_tests:
          - not_null

      - name: average_listing_availability_rate_pct
        description: >
          Moyenne non pondérée des taux de disponibilité individuels. Chaque annonce reçoit le même poids, quel que soit le nombre de jours représentés.
        data_tests:
          - not_null

      - name: median_listing_availability_rate_pct
        description: Taux médian de disponibilité des annonces sur le mois.
        data_tests:
          - not_null

      - name: listing_day_coverage_pct
        description: >
          Pourcentage des journées-annonces attendues effectivement représentées. Une valeur inférieure à 100 indique une couverture partielle du calendrier.
        data_tests:
          - not_null

      - name: full_month_listing_share_pct
        description: Pourcentage d'annonces représentées bénéficiant d'une couverture mensuelle complète.
        data_tests:
          - not_null

      - name: is_full_month_coverage
        description: >
          Vrai uniquement lorsque toutes les journées-annonces attendues pour la population représentée sont présentes.
        data_tests:
          - not_null

      - name: market_availability_rate_pct
        description: >
          Pourcentage des journées-annonces représentées indiquées disponibles. Ce taux est pondéré par les journées-annonces et ne constitue pas un taux d'occupation.
        data_tests:
          - not_null

      - name: market_unavailability_rate_pct
        description: >
          Pourcentage des journées-annonces représentées indiquées indisponibles. Une indisponibilité ne prouve pas une réservation.
        data_tests:
          - not_null
version: 2

models:
  - name: mart_host_snapshot
    description: >
      Indicateurs relatifs aux hôtes à l'échelle du marché pour chaque snapshot Inside Airbnb. Chaque ligne représente un pays, une ville et une date de snapshot. Les portefeuilles d'hôtes sont calculés à partir des annonces réellement observées dans le snapshot correspondant. Les indicateurs de concentration décrivent donc la population observée dans Inside Airbnb, et non l'intégralité du marché locatif de courte durée.

    columns:
      - name: source_country
        description: Pays associé au jeu de données source.
        data_tests:
          - not_null

      - name: source_city
        description: Ville associée au jeu de données source.
        data_tests:
          - not_null

      - name: snapshot_date
        description: Date du snapshot Inside Airbnb.
        data_tests:
          - not_null

      - name: host_count
        description: Nombre d'hôtes distincts observés dans le snapshot.
        data_tests:
          - not_null

      - name: listing_count
        description: Nombre d'annonces détenues par les hôtes observés.
        data_tests:
          - not_null

      - name: average_listings_per_host
        description: Nombre moyen d'annonces observées par hôte.
        data_tests:
          - not_null

      - name: median_listings_per_host
        description: Nombre médian d'annonces observées par hôte.
        data_tests:
          - not_null

      - name: max_listings_per_host
        description: Nombre maximal d'annonces observées détenues par un même hôte.
        data_tests:
          - not_null

      - name: single_listing_host_count
        description: Nombre d'hôtes possédant exactement une annonce observée.
        data_tests:
          - not_null

      - name: host_count_2_to_5
        description: Nombre d'hôtes possédant de 2 à 5 annonces observées.
        data_tests:
          - not_null

      - name: host_count_6_to_10
        description: Nombre d'hôtes possédant de 6 à 10 annonces observées.
        data_tests:
          - not_null

      - name: host_count_11_to_20
        description: Nombre d'hôtes possédant de 11 à 20 annonces observées.
        data_tests:
          - not_null

      - name: host_count_21_plus
        description: Nombre d'hôtes possédant au moins 21 annonces observées.
        data_tests:
          - not_null

      - name: multi_listing_host_count
        description: Nombre d'hôtes possédant plusieurs annonces observées.
        data_tests:
          - not_null

      - name: listings_controlled_by_single_listing_hosts
        description: Nombre d'annonces détenues par les hôtes ne possédant qu'une annonce.
        data_tests:
          - not_null

      - name: listings_controlled_by_multi_listing_hosts
        description: Nombre d'annonces détenues par les hôtes possédant plusieurs annonces.
        data_tests:
          - not_null

      - name: superhost_count
        description: Nombre d'hôtes observés classés Superhosts.
        data_tests:
          - not_null

      - name: identity_verified_host_count
        description: Nombre d'hôtes observés dont l'identité est indiquée comme vérifiée.
        data_tests:
          - not_null

      - name: listings_with_price
        description: Nombre d'annonces observées disposant d'un prix.
        data_tests:
          - not_null

      - name: listings_controlled_by_top_1_pct_hosts
        description: Nombre d'annonces détenues par les 1 % d'hôtes les mieux classés selon leur nombre d'annonces observées. Le seuil du nombre d'hôtes est arrondi à l'entier supérieur avec CEIL.
        data_tests:
          - not_null

      - name: listings_controlled_by_top_5_pct_hosts
        description: Nombre d'annonces détenues par les 5 % d'hôtes les mieux classés selon leur nombre d'annonces observées.
        data_tests:
          - not_null

      - name: listings_controlled_by_top_10_pct_hosts
        description: Nombre d'annonces détenues par les 10 % d'hôtes les mieux classés selon leur nombre d'annonces observées.
        data_tests:
          - not_null

      - name: host_hhi
        description: Indice de Herfindahl-Hirschman calculé à partir de la part de chaque hôte dans les annonces observées. Les parts sont exprimées de 0 à 100, donc l'indice HHI théorique varie de 0 à 10 000.
        data_tests:
          - not_null

      - name: single_listing_host_share_pct
        description: Pourcentage d'hôtes observés possédant exactement une annonce.
        data_tests:
          - not_null

      - name: multi_listing_host_share_pct
        description: Pourcentage d'hôtes observés possédant plusieurs annonces.
        data_tests:
          - not_null

      - name: top_1_pct_listing_share_pct
        description: Pourcentage des annonces observées détenues par les 1 % d'hôtes les plus importants.
        data_tests:
          - not_null

      - name: top_5_pct_listing_share_pct
        description: Pourcentage des annonces observées détenues par les 5 % d'hôtes les plus importants.
        data_tests:
          - not_null

      - name: top_10_pct_listing_share_pct
        description: Pourcentage des annonces observées détenues par les 10 % d'hôtes les plus importants.
        data_tests:
          - not_null

      - name: single_listing_host_listing_share_pct
        description: Pourcentage d'annonces détenues par les hôtes ne possédant qu'une annonce.
        data_tests:
          - not_null

      - name: multi_listing_host_listing_share_pct
        description: Pourcentage d'annonces détenues par les hôtes possédant plusieurs annonces.
        data_tests:
          - not_null

      - name: superhost_share_pct
        description: Pourcentage d'hôtes observés classés Superhosts.
        data_tests:
          - not_null

      - name: identity_verified_host_share_pct
        description: Pourcentage d'hôtes observés dont l'identité est indiquée comme vérifiée.
        data_tests:
          - not_null
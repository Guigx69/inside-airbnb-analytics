version: 2

models:
  - name: mart_availability_horizon_snapshot
    description: >
      Market-level reconstructed availability indicators derived from the
      detailed Inside Airbnb calendar. One row represents one country, city
      and snapshot. Availability is calculated over 30, 60, 90 and 365-day
      horizons anchored on the first calendar date actually observed for each
      listing. These indicators describe calendar availability and must not be
      interpreted as observed occupancy or confirmed bookings.

    columns:
      - name: source_country
        description: Country associated with the source dataset.
        data_tests:
          - not_null

      - name: source_city
        description: City associated with the source dataset.
        data_tests:
          - not_null

      - name: snapshot_date
        description: Inside Airbnb snapshot date.
        data_tests:
          - not_null

      - name: listing_count
        description: Nombre d'annonces représentées dans le calendrier détaillé.
        data_tests:
          - not_null

      - name: earliest_availability_window_start_date
        description: Earliest calendar-window start date among listings in the snapshot.
        data_tests:
          - not_null

      - name: latest_availability_window_start_date
        description: Latest calendar-window start date among listings in the snapshot.
        data_tests:
          - not_null

      - name: represented_days_30d
        description: Nombre total de journées-annonces représentées sur l'horizon de 30 jours.
        data_tests:
          - not_null

      - name: available_days_30d
        description: Nombre total de jours indiqués disponibles sur l'horizon de 30 jours.
        data_tests:
          - not_null

      - name: market_availability_rate_30d_pct
        description: >
          Part des journées-annonces représentées et indiquées disponibles sur
          30-day horizon.
        data_tests:
          - not_null

      - name: average_listing_availability_rate_30d_pct
        description: Moyenne des taux de disponibilité individuels des annonces sur 30 jours.
        data_tests:
          - not_null

      - name: median_listing_availability_rate_30d_pct
        description: Médiane des taux de disponibilité individuels des annonces sur 30 jours.
        data_tests:
          - not_null

      - name: represented_days_60d
        description: Nombre total de journées-annonces représentées sur l'horizon de 60 jours.
        data_tests:
          - not_null

      - name: available_days_60d
        description: Nombre total de jours indiqués disponibles sur l'horizon de 60 jours.
        data_tests:
          - not_null

      - name: market_availability_rate_60d_pct
        description: >
          Part des journées-annonces représentées et indiquées disponibles sur
          60-day horizon.
        data_tests:
          - not_null

      - name: average_listing_availability_rate_60d_pct
        description: Moyenne des taux de disponibilité individuels des annonces sur 60 jours.
        data_tests:
          - not_null

      - name: median_listing_availability_rate_60d_pct
        description: Médiane des taux de disponibilité individuels des annonces sur 60 jours.
        data_tests:
          - not_null

      - name: represented_days_90d
        description: Nombre total de journées-annonces représentées sur l'horizon de 90 jours.
        data_tests:
          - not_null

      - name: available_days_90d
        description: Nombre total de jours indiqués disponibles sur l'horizon de 90 jours.
        data_tests:
          - not_null

      - name: market_availability_rate_90d_pct
        description: >
          Part des journées-annonces représentées et indiquées disponibles sur
          90-day horizon.
        data_tests:
          - not_null

      - name: average_listing_availability_rate_90d_pct
        description: Moyenne des taux de disponibilité individuels des annonces sur 90 jours.
        data_tests:
          - not_null

      - name: median_listing_availability_rate_90d_pct
        description: Médiane des taux de disponibilité individuels des annonces sur 90 jours.
        data_tests:
          - not_null

      - name: represented_days_365d
        description: Nombre total de journées-annonces représentées sur l'horizon de 365 jours.
        data_tests:
          - not_null

      - name: available_days_365d
        description: Nombre total de jours indiqués disponibles sur l'horizon de 365 jours.
        data_tests:
          - not_null

      - name: market_availability_rate_365d_pct
        description: >
          Part des journées-annonces représentées et indiquées disponibles sur
          complete 365-day horizon.
        data_tests:
          - not_null

      - name: average_listing_availability_rate_365d_pct
        description: Moyenne des taux de disponibilité individuels des annonces sur 365 jours.
        data_tests:
          - not_null

      - name: median_listing_availability_rate_365d_pct
        description: Médiane des taux de disponibilité individuels des annonces sur 365 jours.
        data_tests:
          - not_null
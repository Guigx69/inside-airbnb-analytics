version: 2

models:
  - name: mart_market_transition
    description: >
      Indicateurs de transition du marché entre deux snapshots Inside Airbnb consécutifs. Chaque ligne correspond à un pays, une ville et une paire de snapshots. Une annonce disparue est présente dans le snapshot précédent mais absente de l'actuel : cela ne prouve pas une sortie définitive d'Airbnb. Une annonce réapparue a déjà été observée historiquement, était absente du snapshot immédiatement précédent et revient dans l'actuel.

    columns:
      - name: source_country
        description: Pays associé au jeu de données source.
        data_tests:
          - not_null

      - name: source_city
        description: Ville associée au jeu de données source.
        data_tests:
          - not_null

      - name: previous_snapshot_date
        description: Snapshot de marché précédent utilisé pour la transition.
        data_tests:
          - not_null

      - name: snapshot_date
        description: Snapshot de marché actuel utilisé pour la transition.
        data_tests:
          - not_null

      - name: days_between_snapshots
        description: Nombre de jours entre les snapshots précédent et actuel.
        data_tests:
          - not_null

      - name: previous_listing_count
        description: Nombre d'annonces présentes dans le snapshot précédent.
        data_tests:
          - not_null

      - name: current_listing_count
        description: Nombre d'annonces présentes dans le snapshot actuel.
        data_tests:
          - not_null

      - name: net_listing_change
        description: Nombre d'annonces actuel moins celui du snapshot précédent.
        data_tests:
          - not_null

      - name: net_listing_change_pct
        description: Percentage change in listing count relative to the previous snapshot.
        data_tests:
          - not_null

      - name: retained_listing_count
        description: Listings present in both consecutive snapshots.
        data_tests:
          - not_null

      - name: disappeared_listing_count
        description: >
          Listings present in the previous snapshot but absent from the current
          snapshot. This does not prove a permanent exit from Airbnb.
        data_tests:
          - not_null

      - name: newly_observed_listing_count
        description: >
          Listings observed for the first time in the available historical
          window at the current snapshot.
        data_tests:
          - not_null

      - name: returned_after_gap_listing_count
        description: >
          Listings observed before the previous snapshot, absent from the
          previous snapshot and observed again in the current snapshot.
        data_tests:
          - not_null

      - name: retention_rate_pct
        description: Part des annonces du snapshot précédent conservées dans le snapshot actuel.
        data_tests:
          - not_null

      - name: disappearance_rate_pct
        description: Part des annonces du snapshot précédent absentes du snapshot actuel.
        data_tests:
          - not_null

      - name: newly_observed_share_pct
        description: Part des annonces nouvellement observées dans le snapshot actuel.
        data_tests:
          - not_null

      - name: returned_after_gap_share_pct
        description: Part des annonces réapparues après une interruption d'observation.
        data_tests:
          - not_null

      - name: has_returned_listings
        description: Whether the transition contains at least one returned-after-gap listing.
        data_tests:
          - not_null
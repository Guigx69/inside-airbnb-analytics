version: 2

models:
  - name: mart_room_type_snapshot
    description: >
      Indicateurs agrégés par pays, ville, date de snapshot et type de logement. Le modèle présente la répartition des annonces, les prix, la disponibilité et les avis reconstitués. Les populations agrégées d'annonces et d'avis sont rapprochées avec mart_market_snapshot.

    columns:
      - name: source_country
        description: Pays associé au jeu de données source.
        data_tests:
          - not_null

      - name: source_city
        description: Ville associée au jeu de données source.
        data_tests:
          - not_null

      - name: snapshot_date
        description: Date du snapshot Inside Airbnb.
        data_tests:
          - not_null

      - name: room_type
        description: Airbnb room type associated with the listings.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "Entire home/apt"
                  - "Private room"
                  - "Shared room"
                  - "Hotel room"

      - name: listing_count
        description: Nombre d'annonces observées pour ce type de logement.
        data_tests:
          - not_null

      - name: listing_share_pct
        description: >
          Percentage of the market listing population represented by the
          room type. Values are rounded individually, therefore their sum
          can differ slightly from exactly 100 percent.
        data_tests:
          - not_null

      - name: listings_with_price
        description: Nombre d'annonces dont le prix n'est pas nul.
        data_tests:
          - not_null

      - name: average_price
        description: >
          Average listing price for listings with available price data.
          Null when no listing in the room type has a price.

      - name: median_price
        description: >
          Median listing price for listings with available price data.
          Null when no listing in the room type has a price.

      - name: average_availability_rate_pct
        description: >
          Average reconstructed calendar availability rate for listings
          belonging to the room type.

      - name: reconstructed_review_count_l30d
        description: >
          Total number of reconstructed reviews during the 30-day window
          ending on the snapshot date for listings in the room type.
        data_tests:
          - not_null

      - name: reconstructed_review_count_l90d
        description: >
          Total number of reconstructed reviews during the 90-day window
          ending on the snapshot date for listings in the room type.
        data_tests:
          - not_null

      - name: reconstructed_review_count_l365d
        description: >
          Total number of reconstructed reviews during the 365-day window
          ending on the snapshot date for listings in the room type.
        data_tests:
          - not_null
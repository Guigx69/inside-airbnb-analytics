version: 2

models:
  - name: mart_price_distribution_snapshot
    description: >
      Répartition des annonces par pays, ville, snapshot et tranche de prix. Six tranches de prix sont distinguées, ainsi que la catégorie NO_PRICE pour les prix manquants. Le modèle présente le nombre d'annonces, la couverture des prix, les statistiques de prix et l'activité d'avis reconstituée par tranche.

    columns:
      - name: source_country
        description: Pays associé au jeu de données source.
        data_tests:
          - not_null

      - name: source_city
        description: Ville associée au jeu de données source.
        data_tests:
          - not_null

      - name: snapshot_date
        description: Date du snapshot Inside Airbnb.
        data_tests:
          - not_null

      - name: price_band
        description: Tranche de prix de l'annonce ; NO_PRICE désigne les prix absents.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - '01_<50'
                  - '02_50_99'
                  - '03_100_149'
                  - '04_150_199'
                  - '05_200_299'
                  - '06_300_PLUS'
                  - 'NO_PRICE'

      - name: listing_count
        description: Nombre d'annonces observées dans le périmètre considéré.
        data_tests:
          - not_null

      - name: listings_with_price
        description: Nombre d'annonces dont le prix est renseigné.
        data_tests:
          - not_null

      - name: market_listing_share_pct
        description: Part des annonces du marché appartenant à cette tranche de prix.
        data_tests:
          - not_null

      - name: reconstructed_review_count_l30d
        description: Nombre d'avis reconstitués sur les 30 jours précédant la date du snapshot, inclusivement.
        data_tests:
          - not_null

      - name: reconstructed_review_count_l90d
        description: Nombre d'avis reconstitués sur les 90 jours précédant la date du snapshot, inclusivement.
        data_tests:
          - not_null

      - name: reconstructed_review_count_l365d
        description: Nombre d'avis reconstitués sur les 365 jours précédant la date du snapshot, inclusivement.
        data_tests:
          - not_null
      
      - name: price_band_order
        description: Rang de tri de la tranche de prix.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4, 5, 6]
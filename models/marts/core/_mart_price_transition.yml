version: 2

models:
  - name: mart_price_transition
    description: >
      Analyse des variations de prix des annonces entre deux snapshots Inside Airbnb observés. Chaque ligne représente une transition pour un pays et une ville. Les snapshots peuvent être consécutifs ou séparés par une ou plusieurs observations manquantes. Les variations de prix sont calculées uniquement pour les annonces disposant d'un prix dans les deux snapshots.

    columns:
      - name: source_country
        description: Pays associé au jeu de données source.
        data_tests:
          - not_null

      - name: source_city
        description: Ville associée au jeu de données source.
        data_tests:
          - not_null

      - name: previous_snapshot_date
        description: Date du snapshot précédent observé.
        data_tests:
          - not_null

      - name: snapshot_date
        description: Date du snapshot actuel observé.
        data_tests:
          - not_null

      - name: transition_type
        description: Type de transition entre observations. CONSECUTIVE indique qu'aucun snapshot attendu ne manque ; AFTER_GAP indique qu'au moins un snapshot attendu manque entre les observations.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - CONSECUTIVE
                  - AFTER_GAP

      - name: missing_snapshot_count
        description: Nombre de snapshots attendus manquants entre deux observations.
        data_tests:
          - not_null

      - name: days_between_observations
        description: Nombre de jours calendaires entre les deux observations.
        data_tests:
          - not_null

      - name: listing_observation_count
        description: Nombre d'observations d'annonces représentées par la transition.
        data_tests:
          - not_null

      - name: listings_with_previous_price
        description: Nombre d'observations disposant d'un prix dans le snapshot précédent.
        data_tests:
          - not_null

      - name: listings_with_current_price
        description: Nombre d'observations disposant d'un prix dans le snapshot actuel.
        data_tests:
          - not_null

      - name: comparable_listing_count
        description: Nombre d'annonces disposant d'un prix dans les deux snapshots, donc utilisables pour analyser les variations de prix.
        data_tests:
          - not_null

      - name: price_increase_count
        description: Nombre d'annonces comparables dont le prix a augmenté.
        data_tests:
          - not_null

      - name: price_decrease_count
        description: Nombre d'annonces comparables dont le prix a diminué.
        data_tests:
          - not_null

      - name: unchanged_price_count
        description: Nombre d'annonces comparables dont le prix est resté stable.
        data_tests:
          - not_null

      - name: comparable_price_coverage_pct
        description: Pourcentage d'observations d'annonces disposant de prix comparables dans les snapshots précédent et actuel.
        data_tests:
          - not_null

      - name: price_increase_share_pct
        description: Pourcentage d'annonces comparables dont le prix a augmenté ; nul si aucune annonce comparable n'existe.

      - name: price_decrease_share_pct
        description: Pourcentage d'annonces comparables dont le prix a diminué ; nul si aucune annonce comparable n'existe.

      - name: unchanged_price_share_pct
        description: Pourcentage d'annonces comparables dont le prix est resté stable ; nul si aucune annonce comparable n'existe.

      - name: average_previous_price
        description: Prix moyen précédent des annonces comparables.

      - name: average_current_price
        description: Prix moyen actuel des annonces comparables.

      - name: median_previous_price
        description: Prix médian précédent parmi les annonces comparables.

      - name: median_current_price
        description: Prix médian actuel parmi les annonces comparables.

      - name: average_price_change
        description: Variation absolue moyenne du prix par annonce parmi les annonces comparables.

      - name: median_price_change
        description: Variation absolue médiane du prix par annonce parmi les annonces comparables.

      - name: average_price_change_pct
        description: Moyenne des variations de prix en pourcentage calculées individuellement par annonce. Elle diffère de la variation en pourcentage entre les prix moyens agrégés.

      - name: median_price_change_pct
        description: Médiane des variations de prix en pourcentage calculées individuellement parmi les annonces comparables.
version: 2

models:
  - name: fct_listing_snapshot
    description: >
      Table de faits analytique contenant une ligne par annonce Airbnb observée et par snapshot Inside Airbnb. Elle expose les attributs des annonces, hôtes, localisations, biens, prix, disponibilités et avis, ainsi que les indicateurs historiques d'observation et de changement.

    columns:
      - name: source_country
        description: Pays associé au jeu de données source.
        data_tests:
          - not_null

      - name: source_city
        description: Ville associée au jeu de données source.
        data_tests:
          - not_null

      - name: snapshot_date
        description: Date du snapshot source Inside Airbnb.
        data_tests:
          - not_null

      - name: listing_id
        description: Identifiant de l'annonce Airbnb.
        data_tests:
          - not_null

      - name: host_id
        description: Identifiant de l'hôte Airbnb.
        data_tests:
          - not_null

      - name: snapshot_sequence
        description: Rang chronologique du snapshot source pour cette ville.
        data_tests:
          - not_null

      - name: first_seen_snapshot
        description: >
          First snapshot in this dataset in which the listing was observed.
        data_tests:
          - not_null

      - name: last_seen_snapshot
        description: >
          Most recent snapshot in this dataset in which the listing was observed.
        data_tests:
          - not_null

      - name: snapshot_count
        description: Nombre de snapshots dans lesquels l'annonce a été observée.
        data_tests:
          - not_null

      - name: is_first_observation
        description: Vrai pour le premier snapshot dans lequel l'annonce est observée.
        data_tests:
          - not_null

      - name: is_last_observation
        description: Vrai pour le dernier snapshot dans lequel l'annonce est observée.
        data_tests:
          - not_null

      - name: has_observation_gap
        description: >
          Indicates whether one or more expected snapshots are missing
          between this observation and the previous observation.

      - name: missing_snapshot_count
        description: >
          Number of expected snapshots missing since the previous observation.

      - name: has_host_changed
        description: >
          True when the host differs from the previous observed snapshot.
        data_tests:
          - not_null

      - name: has_room_type_changed
        description: >
          True when the room type differs from the previous observed snapshot.
        data_tests:
          - not_null
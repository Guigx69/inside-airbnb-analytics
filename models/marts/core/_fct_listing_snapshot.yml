version: 2

models:
  - name: fct_listing_snapshot
    description: >
      Table de faits analytique contenant une ligne par annonce Airbnb observée et par snapshot Inside Airbnb. Elle expose les attributs des annonces, hôtes, localisations, biens, prix, disponibilités et avis, ainsi que les indicateurs historiques d'observation et de changement.

    columns:
      - name: source_country
        description: Pays associé au jeu de données source.
        data_tests:
          - not_null

      - name: source_city
        description: Ville associée au jeu de données source.
        data_tests:
          - not_null

      - name: snapshot_date
        description: Date du snapshot Inside Airbnb.
        data_tests:
          - not_null

      - name: listing_id
        description: Identifiant de l'annonce Airbnb.
        data_tests:
          - not_null

      - name: host_id
        description: Identifiant de l'hôte Airbnb.
        data_tests:
          - not_null

      - name: snapshot_sequence
        description: Rang chronologique du snapshot source pour cette ville.
        data_tests:
          - not_null

      - name: first_seen_snapshot
        description: Premier snapshot dans lequel l'annonce est observée.
        data_tests:
          - not_null

      - name: last_seen_snapshot
        description: Dernier snapshot dans lequel l'annonce est observée.
        data_tests:
          - not_null

      - name: snapshot_count
        description: Nombre de snapshots dans lesquels l'annonce est observée.
        data_tests:
          - not_null

      - name: is_first_observation
        description: Vrai pour la première observation de l'annonce.
        data_tests:
          - not_null

      - name: is_last_observation
        description: Vrai pour la dernière observation de l'annonce.
        data_tests:
          - not_null

      - name: has_observation_gap
        description: Indique si des snapshots attendus sont manquants entre l'observation actuelle et la précédente.

      - name: missing_snapshot_count
        description: Nombre de snapshots attendus manquants depuis l'observation précédente.

      - name: has_host_changed
        description: Vrai si l'hôte diffère de celui du snapshot précédent observé.
        data_tests:
          - not_null

      - name: has_room_type_changed
        description: Vrai si le type de logement diffère de celui du snapshot précédent observé.
        data_tests:
          - not_null
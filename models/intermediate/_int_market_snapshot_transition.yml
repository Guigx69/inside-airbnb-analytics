version: 2

models:
  - name: int_market_snapshot_transition
    description: >
      Indicateurs de transition du marché entre snapshots Inside Airbnb consécutifs. Les snapshots initiaux sont exclus faute de snapshot précédent. Chaque ligne représente un pays, une ville et une transition entre un snapshot précédent et un snapshot actuel.

    columns:
      - name: source_country
        description: Pays associé au jeu de données source.
        data_tests:
          - not_null

      - name: source_city
        description: Ville associée au jeu de données source.
        data_tests:
          - not_null

      - name: previous_snapshot_date
        description: Date du snapshot de marché immédiatement précédent.
        data_tests:
          - not_null

      - name: snapshot_date
        description: Date du snapshot de marché actuel.
        data_tests:
          - not_null

      - name: previous_listing_count
        description: Nombre d'annonces observées dans le snapshot précédent.
        data_tests:
          - not_null

      - name: current_listing_count
        description: Nombre d'annonces observées dans le snapshot actuel.
        data_tests:
          - not_null

      - name: retained_listing_count
        description: Annonces observées dans les deux snapshots consécutifs.
        data_tests:
          - not_null

      - name: disappeared_listing_count
        description: >
          Annonces observées dans le snapshot précédent mais absentes du snapshot actuel.
        data_tests:
          - not_null

      - name: newly_observed_listing_count
        description: >
          Annonces observées pour la première fois dans la fenêtre historique lors du snapshot actuel.
        data_tests:
          - not_null

      - name: returned_after_gap_listing_count
        description: >
          Annonces présentes dans le snapshot actuel, absentes du précédent immédiat, mais observées dans un snapshot antérieur.
        data_tests:
          - not_null

      - name: net_listing_change
        description: Current listing count minus previous listing count.
        data_tests:
          - not_null

      - name: retention_rate_pct
        description: Percentage of previous listings retained in the current snapshot.
        data_tests:
          - not_null

      - name: disappearance_rate_pct
        description: Percentage of previous listings absent from the current snapshot.
        data_tests:
          - not_null
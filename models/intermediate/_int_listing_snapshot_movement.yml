version: 2

models:
  - name: int_listing_snapshot_movement
    description: >
      Classe chaque annonce observée dans un snapshot de marché selon sa présence dans le snapshot immédiatement précédent. Chaque ligne représente un pays, une ville, un snapshot et une annonce. Le premier snapshot du marché est classé baseline, car aucun snapshot précédent n'existe.

    columns:
      - name: source_country
        description: Pays associé au jeu de données source.
        data_tests:
          - not_null

      - name: source_city
        description: Ville associée au jeu de données source.
        data_tests:
          - not_null

      - name: snapshot_date
        description: Current Date du snapshot Inside Airbnb.
        data_tests:
          - not_null

      - name: listing_id
        description: Identifiant de l'annonce observée dans le snapshot actuel.
        data_tests:
          - not_null

      - name: snapshot_sequence
        description: Numéro d'ordre chronologique du snapshot de marché.
        data_tests:
          - not_null

      - name: market_previous_snapshot_date
        description: >
          Date du snapshot de marché immédiatement précédent ; valeur nulle pour le premier snapshot, sans transition calculable.

      - name: first_seen_snapshot
        description: First snapshot in which the listing is observed.
        data_tests:
          - not_null

      - name: snapshot_count
        description: Nombre de snapshots dans lesquels l'annonce est observée.
        data_tests:
          - not_null

      - name: has_observation_gap
        description: >
          Indique si l'annonce réapparaît après une interruption de son historique d'observation. La première observation peut être nulle selon le modèle historique amont.

      - name: was_present_previous_snapshot
        description: >
          Vrai si l'annonce était également observée dans le snapshot de marché immédiatement précédent.
        data_tests:
          - not_null

      - name: movement_status
        description: >
          Classification du mouvement de l'annonce : baseline, retained, newly_observed ou returned_after_gap.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - baseline
                  - retained
                  - newly_observed
                  - returned_after_gap
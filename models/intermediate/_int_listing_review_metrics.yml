version: 2

models:
  - name: int_listing_review_metrics
    description: >
      Indicateurs d'avis reconstitués à partir des avis dédupliqués pour chaque snapshot d'annonces. Chaque ligne représente un pays, une ville, un snapshot et une annonce. Seuls les avis dont review_date est antérieure ou égale à la date du snapshot sont pris en compte. Ces indicateurs restent distincts des compteurs publiés par Inside Airbnb et ne sont pas censés leur correspondre exactement.

    columns:
      - name: source_country
        description: Pays associé au jeu de données source.
        data_tests:
          - not_null

      - name: source_city
        description: Ville associée au jeu de données source.
        data_tests:
          - not_null

      - name: snapshot_date
        description: Date du snapshot des annonces Inside Airbnb.
        data_tests:
          - not_null

      - name: listing_id
        description: Identifiant de l'annonce Airbnb.
        data_tests:
          - not_null

      - name: review_count_to_snapshot
        description: >
          Number of deduplicated reviews whose review date is less than or
          equal to the snapshot date.
        data_tests:
          - not_null

      - name: review_count_l30d
        description: >
          Number of deduplicated reviews in the inclusive 30-day period ending
          on the snapshot date.
        data_tests:
          - not_null

      - name: review_count_l90d
        description: >
          Number of deduplicated reviews in the inclusive 90-day period ending
          on the snapshot date.
        data_tests:
          - not_null

      - name: review_count_l365d
        description: >
          Number of deduplicated reviews in the inclusive 365-day period ending
          on the snapshot date.
        data_tests:
          - not_null

      - name: first_review_date_to_snapshot
        description: >
          Date du plus ancien avis observé pour l'annonce jusqu'à la date du snapshot.

      - name: last_review_date_to_snapshot
        description: >
          Most recent review date observed for the listing up to the snapshot
          date.

      - name: days_since_last_review
        description: >
          Number of days between the most recent reconstructed review and the
          snapshot date. Null when no review exists up to the snapshot.

      - name: has_reviews_to_snapshot
        description: Whether at least one reconstructed review exists.
        data_tests:
          - not_null

      - name: has_review_l30d
        description: Whether at least one reconstructed review exists in L30D.
        data_tests:
          - not_null

      - name: has_review_l90d
        description: Whether at least one reconstructed review exists in L90D.
        data_tests:
          - not_null

      - name: has_review_l365d
        description: Whether at least one reconstructed review exists in L365D.
        data_tests:
          - not_null
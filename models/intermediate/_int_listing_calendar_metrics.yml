version: 2

models:
  - name: int_listing_calendar_metrics
    description: >
      Indicateurs agrégés du calendrier Inside Airbnb par annonce et par snapshot. Chaque ligne représente une annonce observée dans un snapshot du calendrier source. Les mesures décrivent la disponibilité publique affichée dans le calendrier et ne constituent pas une preuve d'occupation ou de réservation.

    columns:
      - name: source_country
        description: Pays associé au jeu de données source.
        data_tests:
          - not_null

      - name: source_city
        description: Ville associée au jeu de données source.
        data_tests:
          - not_null

      - name: snapshot_date
        description: Date du snapshot source Inside Airbnb.
        data_tests:
          - not_null

      - name: listing_id
        description: Identifiant de l'annonce Airbnb.
        data_tests:
          - not_null

      - name: calendar_row_count
        description: Nombre de lignes de calendrier source agrégées pour l'annonce.
        data_tests:
          - not_null

      - name: calendar_day_count
        description: >
          Nombre de dates calendaires distinctes disponibles pour l'annonce.
          Source calendar coverage may vary across locations, snapshots,
          and individual listings.
        data_tests:
          - not_null

      - name: first_calendar_date
        description: Première date du calendrier disponible dans le snapshot source.
        data_tests:
          - not_null

      - name: last_calendar_date
        description: Dernière date du calendrier disponible dans le snapshot source.
        data_tests:
          - not_null

      - name: available_day_count
        description: Nombre de dates calendaires indiquées comme disponibles.
        data_tests:
          - not_null

      - name: unavailable_day_count
        description: >
          Nombre de dates calendaires indiquées indisponibles. Cela ne correspond pas nécessairement à des nuitées réservées.
        data_tests:
          - not_null

      - name: availability_rate_pct
        description: Pourcentage de lignes calendaires indiquées comme disponibles.
        data_tests:
          - not_null

      - name: unavailability_rate_pct
        description: Pourcentage de lignes calendaires indiquées comme indisponibles.
        data_tests:
          - not_null
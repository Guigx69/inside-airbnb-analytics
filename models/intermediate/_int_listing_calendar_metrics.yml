version: 2

models:
  - name: int_listing_calendar_metrics
    description: >
      Indicateurs agrégés du calendrier Inside Airbnb par annonce et par snapshot.
      Each row represents one listing observed in one source calendar snapshot.
      Availability metrics describe public calendar availability and must not
      be interpreted as observed occupancy or bookings.

    columns:
      - name: source_country
        description: Pays associé au jeu de données source.
        data_tests:
          - not_null

      - name: source_city
        description: Ville associée au jeu de données source.
        data_tests:
          - not_null

      - name: snapshot_date
        description: Date du snapshot source Inside Airbnb.
        data_tests:
          - not_null

      - name: listing_id
        description: Identifiant de l'annonce Airbnb.
        data_tests:
          - not_null

      - name: calendar_row_count
        description: Nombre de lignes de calendrier source agrégées pour l'annonce.
        data_tests:
          - not_null

      - name: calendar_day_count
        description: >
          Nombre de dates calendaires distinctes disponibles pour l'annonce.
          Source calendar coverage may vary across locations, snapshots,
          and individual listings.
        data_tests:
          - not_null

      - name: first_calendar_date
        description: Première date du calendrier disponible dans le snapshot source.
        data_tests:
          - not_null

      - name: last_calendar_date
        description: Dernière date du calendrier disponible dans le snapshot source.
        data_tests:
          - not_null

      - name: available_day_count
        description: Number of calendar dates marked as available.
        data_tests:
          - not_null

      - name: unavailable_day_count
        description: >
          Number of calendar dates marked as unavailable. This does not
          necessarily represent booked nights.
        data_tests:
          - not_null

      - name: availability_rate_pct
        description: Percentage of calendar rows marked as available.
        data_tests:
          - not_null

      - name: unavailability_rate_pct
        description: Percentage of calendar rows marked as unavailable.
        data_tests:
          - not_null
version: 2

models:
  - name: int_host_snapshot
    description: >
      Snapshot par hôte calculé à partir des annonces observées. Chaque ligne représente un hôte, un pays, une ville et un snapshot Inside Airbnb. Le portefeuille observé est reconstitué à partir des annonces ; calculated_host_listings_count, fourni par Inside Airbnb, est conservé séparément pour la traçabilité et le rapprochement.

    columns:
      - name: source_country
        data_tests:
          - not_null

      - name: source_city
        data_tests:
          - not_null

      - name: snapshot_date
        data_tests:
          - not_null

      - name: host_id
        data_tests:
          - not_null

      - name: observed_listing_count
        description: >
          Number of listings belonging to the host and directly observed in
          this city and snapshot.
        data_tests:
          - not_null

      - name: observed_entire_home_listing_count
        data_tests:
          - not_null

      - name: observed_private_room_listing_count
        data_tests:
          - not_null

      - name: observed_shared_room_listing_count
        data_tests:
          - not_null

      - name: listings_with_price
        data_tests:
          - not_null

      - name: observed_host_segment
        description: >
          Segment du portefeuille de l'hôte calculé à partir de observed_listing_count :
          1, 2-5, 6-10, 11-20 or 21+.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['1', '2-5', '6-10', '11-20', '21+']

      - name: is_observed_multi_listing_host
        description: >
          True when more than one listing is observed for the host in the
          snapshot.
        data_tests:
          - not_null

      - name: is_superhost
        data_tests:
          - not_null

      - name: is_host_identity_verified
        data_tests:
          - not_null

      - name: inside_airbnb_calculated_host_listings_count
        description: >
          Nombre d'annonces par hôte fourni par Inside Airbnb, conservé séparément du nombre d'annonces observées reconstitué.
        data_tests:
          - not_null

      - name: calculated_vs_observed_listing_difference
        description: >
          Écart entre le nombre d'annonces par hôte fourni par Inside Airbnb et le portefeuille reconstitué à partir des annonces observées.
        data_tests:
          - not_null
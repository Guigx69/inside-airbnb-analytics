version: 2

models:
  - name: int_neighbourhood_snapshot_transition
    description: >
      Indicateurs de transition par quartier entre snapshots Inside Airbnb consécutifs. Le modèle distingue les annonces conservées, disparues, déplacées entre quartiers, nouvellement observées ou réapparues après une interruption. La jointure interne finale ne conserve que les quartiers représentés des deux côtés de la transition.

    columns:
      - name: source_country
        description: Pays associé au jeu de données source.
        data_tests:
          - not_null

      - name: source_city
        description: Ville associée au jeu de données source.
        data_tests:
          - not_null

      - name: previous_snapshot_date
        description: Date du snapshot de marché immédiatement précédent.
        data_tests:
          - not_null

      - name: snapshot_date
        description: Date du snapshot de marché actuel.
        data_tests:
          - not_null

      - name: neighbourhood
        description: Neighbourhood used as the aggregation grain.

      - name: previous_listing_count
        description: Annonces du quartier dans le snapshot précédent.
        data_tests:
          - not_null

      - name: current_listing_count
        description: Annonces du quartier dans le snapshot actuel.
        data_tests:
          - not_null

      - name: retained_listing_count
        description: Annonces restant dans le même quartier.
        data_tests:
          - not_null

      - name: disappeared_listing_count
        description: Annonces qui ne sont plus observées dans le snapshot actuel.
        data_tests:
          - not_null

      - name: moved_out_listing_count
        description: >
          Annonces toujours observées dans le snapshot actuel, mais affectées à un autre quartier.
        data_tests:
          - not_null

      - name: newly_observed_listing_count
        description: Annonces observées pour la première fois dans l'historique disponible.
        data_tests:
          - not_null

      - name: returned_after_gap_listing_count
        description: >
          Annonces absentes du snapshot précédent mais observées dans un snapshot historique antérieur.
        data_tests:
          - not_null

      - name: moved_in_listing_count
        description: >
          Annonces déjà présentes dans le snapshot précédent, mais affectées alors à un autre quartier.
        data_tests:
          - not_null

      - name: net_listing_change
        description: Nombre d'annonces du quartier dans le snapshot actuel moins celui du précédent.
        data_tests:
          - not_null

      - name: net_listing_change_pct
        description: >
          Variation nette du nombre d'annonces, exprimée en pourcentage de la population du quartier au snapshot précédent.
        data_tests:
          - not_null

      - name: retention_rate_pct
        description: Pourcentage des annonces précédentes conservées dans le même quartier.
        data_tests:
          - not_null

      - name: disappearance_rate_pct
        description: Pourcentage des annonces précédentes qui ne sont plus observées.
        data_tests:
          - not_null
version: 2

models:
  - name: int_calendar_monthly_metrics
    description: >
      Indicateurs mensuels du calendrier détaillé Inside Airbnb par annonce. Chaque ligne correspond à un pays, une ville, un snapshot, un mois et une annonce. Les mois partiels sont conservés et leur couverture est mesurée explicitement. La disponibilité indique les dates déclarées disponibles dans le calendrier source, et non une occupation constatée ou des réservations confirmées.

    columns:
      - name: source_country
        description: Pays associé au jeu de données source.
        data_tests:
          - not_null

      - name: source_city
        description: Ville associée au jeu de données source.
        data_tests:
          - not_null

      - name: snapshot_date
        description: Date du snapshot Inside Airbnb.
        data_tests:
          - not_null

      - name: listing_id
        description: Identifiant de l'annonce Airbnb.
        data_tests:
          - not_null

      - name: calendar_month
        description: Premier jour du mois calendaire représenté par la ligne.
        data_tests:
          - not_null

      - name: days_in_calendar_month
        description: Nombre total de jours calendaires du mois correspondant.
        data_tests:
          - not_null

      - name: first_observed_date
        description: Première date calendaire observée pour l'annonce durant le mois.
        data_tests:
          - not_null

      - name: last_observed_date
        description: Dernière date calendaire observée pour l'annonce durant le mois.
        data_tests:
          - not_null

      - name: represented_day_count
        description: Nombre de jours calendaires réellement représentés pour l'annonce et le mois.
        data_tests:
          - not_null

      - name: available_day_count
        description: Nombre de jours représentés indiqués comme disponibles.
        data_tests:
          - not_null

      - name: unavailable_day_count
        description: Nombre de jours représentés indiqués comme indisponibles.
        data_tests:
          - not_null

      - name: has_full_month_coverage
        description: >
          True when the listing is represented for every calendar day
          of the month.
        data_tests:
          - not_null

      - name: calendar_month_coverage_pct
        description: >
          Percentage of calendar days in the month represented for the listing.
        data_tests:
          - not_null

      - name: availability_rate_pct
        description: >
          Percentage of represented days marked available. This is a
          calendar availability metric, not an occupancy rate.
        data_tests:
          - not_null

      - name: unavailability_rate_pct
        description: >
          Percentage of represented days marked unavailable. Unavailability
          must not be interpreted directly as a confirmed booking.
        data_tests:
          - not_null
version: 2

models:
  - name: int_listing_availability_horizon
    description: >
      Indicateurs de disponibilité reconstitués par annonce à partir du calendrier détaillé Inside Airbnb. Chaque ligne correspond à une annonce, un pays, une ville et un snapshot. Les horizons commencent à la première date calendaire effectivement observée pour l'annonce, et non nécessairement à snapshot_date, car la fenêtre du calendrier peut débuter plusieurs jours après le snapshot. Ces mesures ne prouvent ni une occupation réelle ni des réservations confirmées.

    columns:
      - name: source_country
        description: Pays associé au jeu de données source.
        data_tests:
          - not_null

      - name: source_city
        description: Ville associée au jeu de données source.
        data_tests:
          - not_null

      - name: snapshot_date
        description: Date du snapshot Inside Airbnb.
        data_tests:
          - not_null

      - name: listing_id
        description: Inside Identifiant de l'annonce Airbnb.
        data_tests:
          - not_null

      - name: availability_window_start_date
        description: >
          Première date calendaire réellement observée pour l'annonce dans le
          corresponding snapshot.
        data_tests:
          - not_null

      - name: availability_window_end_date
        description: >
          Dernière date calendaire réellement observée pour l'annonce dans le
          corresponding snapshot.
        data_tests:
          - not_null

      - name: calendar_day_count
        description: Nombre de jours calendaires représentés pour l'annonce.
        data_tests:
          - not_null

      - name: represented_days_30d
        description: Nombre de jours calendaires représentés dans le premier horizon de 30 jours.
        data_tests:
          - not_null

      - name: available_days_30d
        description: >
          Nombre de jours indiqués disponibles parmi les 30 premiers jours calendaires effectivement observés.
        data_tests:
          - not_null

      - name: represented_days_60d
        description: Nombre de jours calendaires représentés sur les 60 premiers jours.
        data_tests:
          - not_null

      - name: available_days_60d
        description: >
          Nombre de jours indiqués disponibles parmi les 60 premiers jours calendaires effectivement observés.
        data_tests:
          - not_null

      - name: represented_days_90d
        description: Nombre de jours calendaires représentés sur les 90 premiers jours.
        data_tests:
          - not_null

      - name: available_days_90d
        description: >
          Nombre de jours indiqués disponibles parmi les 90 premiers jours calendaires effectivement observés.
        data_tests:
          - not_null

      - name: represented_days_365d
        description: Nombre de jours calendaires représentés sur l'horizon complet de 365 jours.
        data_tests:
          - not_null

      - name: available_days_365d
        description: >
          Nombre de jours indiqués disponibles sur la fenêtre calendaire complète de 365 jours effectivement observée.
        data_tests:
          - not_null

      - name: availability_rate_30d_pct
        description: >
          Percentage of available days over the 30-day analytical horizon.
          This metric is null when fewer than 30 calendar days are represented
          for the listing and snapshot.

      - name: availability_rate_60d_pct
        description: >
          Percentage of available days over the 60-day analytical horizon.
          This metric is null when fewer than 60 calendar days are represented
          for the listing and snapshot.

      - name: availability_rate_90d_pct
        description: >
          Percentage of available days over the 90-day analytical horizon.
          This metric is null when fewer than 90 calendar days are represented
          for the listing and snapshot.

      - name: availability_rate_365d_pct
        description: >
          Percentage of available days over the 365-day analytical horizon.
          This metric is null when fewer than 365 calendar days are represented
          for the listing and snapshot.
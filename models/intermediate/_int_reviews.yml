version: 2

models:
  - name: int_reviews
    description: >
      Deduplicated business-level Airbnb reviews across historical Inside Airbnb
      snapshots. The model contains one row per country, city, listing and review.
      Snapshot metadata records when each review was first and last observed in
      the source datasets.

    columns:
      - name: source_country
        description: Pays associé au jeu de données source.
        data_tests:
          - not_null

      - name: source_city
        description: Ville associée au jeu de données source.
        data_tests:
          - not_null

      - name: listing_id
        description: Identifier of the listing associated with the review.
        data_tests:
          - not_null

      - name: review_id
        description: >
          Identifiant de l'avis fourni par Inside Airbnb ; son unicité globale n'est pas garantie indépendamment de listing_id.
        data_tests:
          - not_null

      - name: review_date
        description: Date de publication de l'avis.
        data_tests:
          - not_null

      - name: reviewer_id
        description: Identifiant de l'auteur de l'avis.
        data_tests:
          - not_null

      - name: reviewer_name
        description: >
          Nom public de l'auteur de l'avis le plus récemment observé parmi les snapshots disponibles.

      - name: comments
        description: Texte public de l'avis.
        data_tests:
          - not_null

      - name: first_seen_snapshot
        description: >
          Premier snapshot Inside Airbnb dans lequel l'avis a été observé ; ce n'est pas nécessairement sa date de création.
        data_tests:
          - not_null

      - name: last_seen_snapshot
        description: >
          Dernier snapshot Inside Airbnb dans lequel l'avis a été observé.
        data_tests:
          - not_null

      - name: snapshot_count
        description: Number of source snapshots in which the review was observed.
        data_tests:
          - not_null
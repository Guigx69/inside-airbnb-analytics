version: 2

models:
  - name: int_reviews
    description: >
      Avis Airbnb dédupliqués à l'échelle métier à partir des snapshots historiques Inside Airbnb. Chaque ligne représente un pays, une ville, une annonce et un avis. Les métadonnées de snapshot indiquent les premières et dernières observations de chaque avis dans les jeux de données source.

    columns:
      - name: source_country
        description: Pays associé au jeu de données source.
        data_tests:
          - not_null

      - name: source_city
        description: Ville associée au jeu de données source.
        data_tests:
          - not_null

      - name: listing_id
        description: Identifiant de l'annonce associée à l'avis.
        data_tests:
          - not_null

      - name: review_id
        description: >
          Identifiant de l'avis fourni par Inside Airbnb ; son unicité globale n'est pas garantie indépendamment de listing_id.
        data_tests:
          - not_null

      - name: review_date
        description: Date de publication de l'avis.
        data_tests:
          - not_null

      - name: reviewer_id
        description: Identifiant de l'auteur de l'avis.
        data_tests:
          - not_null

      - name: reviewer_name
        description: >
          Nom public de l'auteur de l'avis le plus récemment observé parmi les snapshots disponibles.

      - name: comments
        description: Texte public de l'avis.
        data_tests:
          - not_null

      - name: first_seen_snapshot
        description: >
          Premier snapshot Inside Airbnb dans lequel l'avis a été observé ; ce n'est pas nécessairement sa date de création.
        data_tests:
          - not_null

      - name: last_seen_snapshot
        description: >
          Dernier snapshot Inside Airbnb dans lequel l'avis a été observé.
        data_tests:
          - not_null

      - name: snapshot_count
        description: Nombre de snapshots source dans lesquels l'avis a été observé.
        data_tests:
          - not_null
version: 2

models:
  - name: stg_listings
    description: >
      Cleaned and typed historical Airbnb listing snapshots sourced from
      Inside Airbnb. The model preserves one record per listing, city,
      country and snapshot date.

    columns:
      - name: source_country
        description: Pays associé au jeu de données source.
        data_tests:
          - not_null

      - name: source_city
        description: Ville associée au jeu de données source.
        data_tests:
          - not_null

      - name: snapshot_date
        description: Date du snapshot Inside Airbnb.
        data_tests:
          - not_null

      - name: listing_id
        description: Identifiant de l'annonce Airbnb.
        data_tests:
          - not_null

      - name: host_id
        description: Identifiant de l'hôte Airbnb.
        data_tests:
          - not_null

      - name: latitude
        description: Latitude de l'annonce.

      - name: longitude
        description: Longitude de l'annonce.

      - name: price
        description: Prix de l'annonce lorsque la source le fournit.

      - name: is_superhost
        description: Indique si l'hôte est identifié comme Superhost.

      - name: has_availability
        description: Indique si des informations de disponibilité sont publiées.

      - name: is_instant_bookable
        description: Indique si l'annonce permet la réservation instantanée.

      - name: estimated_occupancy_l365d
        description: Estimation de l'occupation sur les 365 derniers jours fournie par la source ; ne représente pas une occupation vérifiée.

      - name: estimated_revenue_l365d
        description: Estimation du revenu sur les 365 derniers jours fournie par la source ; ne représente pas un revenu vérifié.
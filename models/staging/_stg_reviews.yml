version: 2

models:
  - name: stg_reviews
    description: >
      Cleaned and typed historical Airbnb review snapshots sourced from
      Inside Airbnb. A review identifier is not assumed to be globally unique:
      the observed technical grain is country, city, snapshot date,
      listing identifier and review identifier.

    columns:
      - name: source_country
        description: Pays associé au jeu de données source.
        data_tests:
          - not_null

      - name: source_city
        description: Ville associée au jeu de données source.
        data_tests:
          - not_null

      - name: snapshot_date
        description: Date du snapshot Inside Airbnb.
        data_tests:
          - not_null

      - name: review_id
        description: >
          Review identifier provided by Inside Airbnb.
          It must not be treated as globally unique independently
          of the listing identifier.
        data_tests:
          - not_null

      - name: listing_id
        description: Annonce associée à l'avis.
        data_tests:
          - not_null

      - name: review_date
        description: Date de publication de l'avis.
        data_tests:
          - not_null

      - name: reviewer_id
        description: Identifiant de l'auteur de l'avis.
        data_tests:
          - not_null

      - name: reviewer_name
        description: Nom public de l'auteur de l'avis fourni par la source.

      - name: comments
        description: Texte public de l'avis fourni par la source.
        data_tests:
          - not_null
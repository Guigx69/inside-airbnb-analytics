version: 2

models:
  - name: stg_calendar
    description: >
      Snapshots historiques des calendriers de disponibilité Inside Airbnb, nettoyés et typés. Chaque ligne représente la disponibilité publique d'une annonce à une date calendaire pour un snapshot donné. Une indisponibilité ne prouve pas une occupation.

    columns:
      - name: source_country
        description: Pays associé au jeu de données source.
        data_tests:
          - not_null

      - name: source_city
        description: Ville associée au jeu de données source.
        data_tests:
          - not_null

      - name: snapshot_date
        description: Date du snapshot Inside Airbnb.
        data_tests:
          - not_null

      - name: listing_id
        description: Identifiant de l'annonce Airbnb.
        data_tests:
          - not_null

      - name: calendar_date
        description: Date du calendrier dont la disponibilité publique est représentée.
        data_tests:
          - not_null

      - name: is_available
        description: >
          Statut de disponibilité publique indiqué par Inside Airbnb.
          La valeur False ne signifie pas nécessairement que le logement était réservé.
        data_tests:
          - not_null

      - name: price
        description: >
          Prix du calendrier lorsqu'il est fourni par la source.
          Ce champ est actuellement nul pour les quatre snapshots Lyon V1.

      - name: adjusted_price
        description: >
          Prix ajusté du calendrier lorsqu'il est fourni par la source.
          Ce champ est actuellement nul pour les quatre snapshots Lyon V1.

      - name: minimum_nights
        description: Durée minimale de séjour applicable à la date calendaire.

      - name: maximum_nights
        description: Durée maximale de séjour applicable à la date calendaire.
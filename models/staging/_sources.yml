version: 2

sources:
  - name: inside_airbnb
    description: >
      Jeux de données bruts Inside Airbnb chargés dans Snowflake. Chaque jeu contient des snapshots historiques identifiés par pays, ville et date de snapshot.

    database: "{{ env_var('SNOWFLAKE_DATABASE', 'AIRBNB') }}"
    schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'RAW') }}"

    tables:
      - name: listings
        identifier: RAW_LISTINGS
        description: >
          Snapshots historiques des annonces Airbnb.
          Chaque enregistrement source représente une annonce pour une date de snapshot.

        columns:
          - name: SOURCE_COUNTRY
            description: Pays associé au jeu de données source.
            data_tests:
              - not_null

          - name: SOURCE_CITY
            description: Ville associée au jeu de données source.
            data_tests:
              - not_null

          - name: SNAPSHOT_DATE
            description: Date du snapshot Inside Airbnb.
            data_tests:
              - not_null

          - name: SOURCE_FILE
            description: Nom du fichier source Inside Airbnb d'origine.
            data_tests:
              - not_null

          - name: LOADED_AT
            description: Horodatage du chargement de l'enregistrement dans Snowflake.
            data_tests:
              - not_null

          - name: RAW_DATA
            description: Enregistrement source d'origine conservé au format VARIANT dans Snowflake.
            data_tests:
              - not_null

      - name: calendar
        identifier: RAW_CALENDAR
        description: >
          Snapshots historiques des calendriers de disponibilité des annonces Airbnb.
          Chaque enregistrement source représente une annonce et une date calendaire
          pour une date de snapshot.

        columns:
          - name: SOURCE_COUNTRY
            data_tests:
              - not_null

          - name: SOURCE_CITY
            data_tests:
              - not_null

          - name: SNAPSHOT_DATE
            data_tests:
              - not_null

          - name: SOURCE_FILE
            data_tests:
              - not_null

          - name: LOADED_AT
            data_tests:
              - not_null

          - name: RAW_DATA
            data_tests:
              - not_null

      - name: reviews
        identifier: RAW_REVIEWS
        description: >
          Snapshots historiques des avis Inside Airbnb.
          Un même avis peut figurer dans plusieurs snapshots.

        columns:
          - name: SOURCE_COUNTRY
            data_tests:
              - not_null

          - name: SOURCE_CITY
            data_tests:
              - not_null

          - name: SNAPSHOT_DATE
            data_tests:
              - not_null

          - name: SOURCE_FILE
            data_tests:
              - not_null

          - name: LOADED_AT
            data_tests:
              - not_null

          - name: RAW_DATA
            data_tests:
              - not_null